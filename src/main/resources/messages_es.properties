about.audience.label=A quién servimos
about.audience.title=Esta comunidad es para ti
about.audience.description=JavaDom está hecho para quienes construyen el futuro de Java en República Dominicana.
about.audience.card1.title=Estudiantes y nuevos ingenieros
about.audience.card1.desc=Aprende fundamentos de Java, recibe mentoría y acelera tu carrera con apoyo real.
about.audience.card2.title=Desarrolladores profesionales
about.audience.card2.desc=Comparte tácticas, aprende nuevos frameworks y mantente al día con prácticas Java de producción.
about.audience.card3.title=Arquitectos y tech leads
about.audience.card3.desc=Habla de arquitectura, decisiones de plataforma y liderazgo con pares que entregan a escala.
about.audience.card4.title=Constructores de plataformas Java
about.audience.card4.desc=Comparte experiencias de runtime, tooling y rendimiento mientras Java evoluciona.
about.audience.card5.title=Equipos DevOps y plataforma
about.audience.card5.desc=Aprende de pares que operan cargas JVM en producción, desde observabilidad hasta despliegue.
about.audience.card6.title=Tecnólogos curiosos
about.audience.card6.desc=Explora el ecosistema JVM, conoce la comunidad y encuentra tu camino en Java.

about.focus.label=Nuestro enfoque
about.focus.title=Por qué Java importa
about.focus.description=Java sigue impulsando sistemas críticos y productos cloud-native modernos en todo el mundo.
about.focus.li1=Java es una habilidad que define carreras en fintech, telecom, retail y servicios gubernamentales.
about.focus.li2=El ecosistema JVM sigue evolucionando con runtimes de alto rendimiento y funciones modernas.
about.focus.li3=Comunidades Java fuertes aceleran el aprendizaje, la mentoría y la innovación regional.

