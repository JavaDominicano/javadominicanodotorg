about.header.label=Sobre nosotros
about.header.title=Quiénes somos
about.header.description=JavaDom es la comunidad Java de República Dominicana, uniendo a creadores que valoran el buen software.
about.mission.label=Misión
about.mission.title=Impulsar ingenieros Java a través de la comunidad
about.mission.p1=Creamos un espacio confiable donde ingenieros Java comparten conocimiento, mentoría y experiencia práctica. Nuestra comunidad conecta profesionales de distintas industrias y niveles para fortalecer el ecosistema Java en República Dominicana.
about.mission.p2=JavaDom es comunidad primero: valoramos claridad, empatía y excelencia técnica. Cada meetup, charla y workshop está diseñado para elevar el talento local y ayudar a equipos a entregar mejor software.
about.vision.title=Nuestra visión
about.vision.description=Una comunidad Java reconocida globalmente en el Caribe, conocida por crecimiento inclusivo y excelencia en ingeniería.

