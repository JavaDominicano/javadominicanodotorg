faq.header.label=FAQ
faq.header.title=Preguntas frecuentes
faq.header.description=Todo lo que necesitas saber sobre JavaDom y cómo participar.
faq.section.general=General
faq.q1=¿Quién puede unirse?
faq.a1=Cualquier persona interesada en Java es bienvenida, desde estudiantes hasta arquitectos senior. Valoramos diversidad de trayectorias y niveles.
faq.q2=¿Es gratis?
faq.a2=Sí. La membresía y la mayoría de eventos son gratuitos. Algunos workshops pueden requerir registro para controlar cupos.
faq.q3=¿Necesito ser experto?
faq.a3=No. Recibimos todos los niveles. Si tienes curiosidad por Java, encajarás.
faq.section.events=Eventos
faq.q4=¿Con qué frecuencia hacen eventos?
faq.a4=Hacemos meetups mensuales y además workshops, paneles y office hours durante el año.
faq.q5=¿Los eventos se graban?
faq.a5=La mayoría de charlas se graban y se publican en YouTube. Algunos workshops son solo presenciales para promover discusión abierta.
faq.section.speaking=Charlas
faq.q6=¿Cómo puedo ser speaker?
faq.a6=Envía una propuesta en nuestra página de Speakers o escríbenos por Discord. Recibimos speakers nuevos y con experiencia.

conduct.header.label=Estándares de comunidad
conduct.header.title=Código de conducta
conduct.header.description=Nuestro compromiso con una comunidad acogedora, inclusiva y libre de acoso.
conduct.section.pledge.title=Nuestro compromiso
conduct.section.pledge.p1=JavaDom se dedica a ofrecer una experiencia libre de acoso para todas las personas, sin importar género, identidad y expresión de género, edad, orientación sexual, discapacidad, apariencia física, tamaño corporal, raza, etnia, nacionalidad, religión o nivel de experiencia técnica.
conduct.section.pledge.p2=No toleramos el acoso en ninguna forma. Este código de conducta aplica a todos los espacios de JavaDom, incluyendo nuestro servidor de Discord, repositorios de GitHub, cuentas de redes sociales, listas de correo y eventos presenciales.
conduct.section.expected.title=Comportamiento esperado
conduct.section.expected.intro=Esperamos que todos los miembros:
conduct.section.expected.li1=Sean respetuosos e inclusivos en todas las interacciones
conduct.section.expected.li2=Usen lenguaje acogedor e inclusivo
conduct.section.expected.li3=Sean considerados con diferentes puntos de vista y experiencias
conduct.section.expected.li4=Acepten críticas constructivas con respeto
conduct.section.expected.li5=Se enfoquen en lo mejor para la comunidad
conduct.section.expected.li6=Demuestren empatía hacia otros miembros
conduct.section.expected.li7=Ayuden a crear un ambiente positivo para aprender y crecer
conduct.section.unacceptable.title=Comportamiento inaceptable
conduct.section.unacceptable.intro=Las siguientes conductas se consideran acoso y son inaceptables:
conduct.section.unacceptable.li1=Comentarios ofensivos sobre género, identidad de género, orientación sexual, discapacidad, enfermedad mental, apariencia física, tamaño corporal, edad, raza, etnia, nacionalidad o religión
conduct.section.unacceptable.li2=Comentarios no bienvenidos sobre elecciones y prácticas de estilo de vida
conduct.section.unacceptable.li3=Uso deliberado de género incorrecto o nombres rechazados
conduct.section.unacceptable.li4=Imágenes sexuales o comportamiento sexual en espacios donde no sea apropiado
conduct.section.unacceptable.li5=Contacto físico y simulaciones de contacto físico sin consentimiento
conduct.section.unacceptable.li6=Amenazas de violencia o lenguaje violento contra otra persona
conduct.section.unacceptable.li7=Incitación a la violencia contra cualquier persona, incluyendo alentar autolesiones
conduct.section.unacceptable.li8=Intimidación deliberada, acecho o seguimiento
conduct.section.unacceptable.li9=Fotografía o grabación acosadora
conduct.section.unacceptable.li10=Interrupción sostenida de charlas, eventos o discusiones en línea
conduct.section.unacceptable.li11=Atención sexual no deseada o insinuaciones
conduct.section.unacceptable.li12=Patrón de contacto social inapropiado, como solicitar/asumir niveles inapropiados de intimidad
conduct.section.unacceptable.li13=Comunicación uno a uno continua después de solicitar que cese
conduct.section.unacceptable.li14=Revelar deliberadamente aspectos de la identidad de una persona sin su consentimiento
conduct.section.unacceptable.li15=Publicación de comunicación privada sin consentimiento
conduct.section.unacceptable.li16=Promover o alentar cualquiera de los comportamientos anteriores
conduct.section.professional.title=Conducta profesional
conduct.section.professional.intro=Además de la conducta general, esperamos comportamiento profesional en discusiones técnicas:
conduct.section.professional.li1=Evita lenguaje despectivo como "solo" o "simplemente" al explicar conceptos
conduct.section.professional.li2=No te burles ni menosprecies preguntas, sin importar el nivel
conduct.section.professional.li3=Da retroalimentación constructiva en lugar de críticas duras
conduct.section.professional.li4=Respeta la propiedad intelectual y da atribución adecuada
conduct.section.professional.li5=Mantén discusiones enfocadas en temas técnicos, no ataques personales
conduct.section.professional.li6=No hagas spam ni autopromoción excesiva de productos o servicios
conduct.section.reporting.title=Guías de reporte
conduct.section.reporting.p1=Si experimentas o presencias un comportamiento inaceptable, o tienes otras preocupaciones, repórtalo contactando a los organizadores:
conduct.section.reporting.li1=Email: conduct@javadom.org
conduct.section.reporting.li2=Discord: Mensaje directo a cualquier moderador
conduct.section.reporting.li3=En persona: Habla con cualquier organizador de eventos
conduct.section.reporting.p2=Todos los reportes serán revisados e investigados prontamente y de forma confidencial. Estamos comprometidos con proteger la privacidad y el bienestar de quienes reportan.
conduct.section.enforcement.title=Aplicación
conduct.section.enforcement.p1=Se espera que quienes sean invitados a detener cualquier comportamiento de acoso cumplan de inmediato. Si alguien incurre en acoso, los organizadores pueden tomar cualquier acción apropiada, incluyendo:
conduct.section.enforcement.li1=Advertir al infractor
conduct.section.enforcement.li2=Expulsión temporal o permanente de la comunidad
conduct.section.enforcement.li3=Remoción de eventos sin reembolso (si aplica)
conduct.section.enforcement.li4=Reportar a las autoridades cuando sea necesario
conduct.section.enforcement.p2=Los organizadores buscarán resolver conflictos con el menor nivel de intervención posible. Sin embargo, priorizamos la seguridad y el bienestar de la comunidad.
conduct.section.scope.title=Alcance
conduct.section.scope.p1=Este Código de Conducta aplica a todos los espacios de JavaDom, en línea y presencial. Incluye:
conduct.section.scope.li1=Servidor de Discord y otras plataformas de chat
conduct.section.scope.li2=Repositorios y discusiones de GitHub
conduct.section.scope.li3=Cuentas y comentarios en redes sociales
conduct.section.scope.li4=Listas de correo y comunicaciones por email
conduct.section.scope.li5=Meetups y eventos presenciales
conduct.section.scope.li6=Comunicaciones uno a uno en el contexto del negocio de la comunidad
conduct.section.scope.p2=Este código también aplica cuando se representa a la comunidad en espacios públicos. Ejemplos: usar un email oficial, publicar en redes sociales oficiales o actuar como representante en eventos online o presenciales.
conduct.section.attribution.title=Atribución
conduct.section.attribution.p1=Este Código de Conducta está adaptado del Contributor Covenant y la política anti-acoso de Geek Feminism.
conduct.cta.title=¿Preguntas o preocupaciones?
conduct.cta.description=Si tienes preguntas sobre este Código de Conducta o necesitas reportar un incidente, no dudes en contactarnos.
conduct.cta.button=Contáctanos
