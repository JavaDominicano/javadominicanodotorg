# JavaDom Site Configuration
quarkus.application.name=JavaDom
quarkus.application.version=1.0.0

# ROQ Configuration
quarkus.roq.site-dir=content
quarkus.roq.static-dir=assets

# Development
quarkus.live-reload.watched-resources=templates/**,content/**,assets/**

# Logging
quarkus.log.level=INFO
quarkus.log.category."io.quarkiverse.roq".level=DEBUG
