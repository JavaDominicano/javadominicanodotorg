faq.header.label=FAQ
faq.header.title=Frequently Asked Questions
faq.header.description=Everything you need to know about JavaDom and how to get involved.
faq.section.general=General
faq.q1=Who can join?
faq.a1=Anyone interested in Java is welcome, from students to senior architects. We value diverse backgrounds and experience levels.
faq.q2=Is it free?
faq.a2=Yes. Membership and most events are free. Some workshops may require registration to manage capacity.
faq.q3=Do I need to be an expert?
faq.a3=No. We welcome every level. If you are curious about Java, you will fit right in.
faq.section.events=Events
faq.q4=How often do you host events?
faq.a4=We host monthly meetups with additional workshops, panels, and office hours throughout the year.
faq.q5=Are events recorded?
faq.a5=Most talks are recorded and published on YouTube. Some workshops are offline-only to promote open discussion.
faq.section.speaking=Speaking
faq.q6=How do I become a speaker?
faq.a6=Submit a talk idea through our Speakers page or reach out on Discord. We welcome first-time speakers and veteran presenters.

conduct.header.label=Community Standards
conduct.header.title=Code of Conduct
conduct.header.description=Our commitment to creating a welcoming, inclusive, and harassment-free community.
conduct.section.pledge.title=Our Pledge
conduct.section.pledge.p1=JavaDom is dedicated to providing a harassment-free experience for everyone, regardless of gender, gender identity and expression, age, sexual orientation, disability, physical appearance, body size, race, ethnicity, nationality, religion, or technical experience level.
conduct.section.pledge.p2=We do not tolerate harassment of community members in any form. This code of conduct applies to all JavaDom spaces, including our Discord server, GitHub repositories, social media accounts, mailing lists, and in-person events.
conduct.section.expected.title=Expected Behavior
conduct.section.expected.intro=We expect all community members to:
conduct.section.expected.li1=Be respectful and inclusive in all interactions
conduct.section.expected.li2=Use welcoming and inclusive language
conduct.section.expected.li3=Be considerate of differing viewpoints and experiences
conduct.section.expected.li4=Accept constructive criticism gracefully
conduct.section.expected.li5=Focus on what is best for the community
conduct.section.expected.li6=Show empathy towards other community members
conduct.section.expected.li7=Help create a positive environment for everyone to learn and grow
conduct.section.unacceptable.title=Unacceptable Behavior
conduct.section.unacceptable.intro=The following behaviors are considered harassment and are unacceptable:
conduct.section.unacceptable.li1=Offensive comments related to gender, gender identity, sexual orientation, disability, mental illness, physical appearance, body size, age, race, ethnicity, nationality, or religion
conduct.section.unacceptable.li2=Unwelcome comments regarding a person's lifestyle choices and practices
conduct.section.unacceptable.li3=Deliberate misgendering or use of rejected names
conduct.section.unacceptable.li4=Sexual images or behavior in spaces where they're not appropriate
conduct.section.unacceptable.li5=Physical contact and simulated physical contact without consent
conduct.section.unacceptable.li6=Threats of violence or violent language directed against another person
conduct.section.unacceptable.li7=Incitement of violence towards any individual, including encouraging self-harm
conduct.section.unacceptable.li8=Deliberate intimidation, stalking, or following
conduct.section.unacceptable.li9=Harassing photography or recording
conduct.section.unacceptable.li10=Sustained disruption of talks, events, or online discussions
conduct.section.unacceptable.li11=Unwelcome sexual attention or advances
conduct.section.unacceptable.li12=Pattern of inappropriate social contact, such as requesting/assuming inappropriate levels of intimacy
conduct.section.unacceptable.li13=Continued one-on-one communication after requests to cease
conduct.section.unacceptable.li14=Deliberate outing of any aspect of a person's identity without their consent
conduct.section.unacceptable.li15=Publication of private communication without consent
conduct.section.unacceptable.li16=Advocating for or encouraging any of the above behaviors
conduct.section.professional.title=Professional Conduct
conduct.section.professional.intro=In addition to general conduct, we expect professional behavior in technical discussions:
conduct.section.professional.li1=Avoid dismissive language like "just" or "simply" when explaining concepts
conduct.section.professional.li2=Don't mock or belittle questions, regardless of experience level
conduct.section.professional.li3=Provide constructive feedback rather than harsh criticism
conduct.section.professional.li4=Respect intellectual property and give proper attribution
conduct.section.professional.li5=Keep discussions focused on technical topics, not personal attacks
conduct.section.professional.li6=Do not spam or excessively self-promote products or services
conduct.section.reporting.title=Reporting Guidelines
conduct.section.reporting.p1=If you experience or witness unacceptable behavior, or have any other concerns, please report it by contacting the community organizers:
conduct.section.reporting.li1=Email: conduct@javadom.org
conduct.section.reporting.li2=Discord: Message any moderator directly
conduct.section.reporting.li3=In Person: Speak to any event organizer
conduct.section.reporting.p2=All reports will be reviewed and investigated promptly and confidentially. We are committed to protecting the privacy and well-being of reporters.
conduct.section.enforcement.title=Enforcement
conduct.section.enforcement.p1=Participants asked to stop any harassing behavior are expected to comply immediately. If a participant engages in harassing behavior, the community organizers may take any action they deem appropriate, including:
conduct.section.enforcement.li1=Warning the offender
conduct.section.enforcement.li2=Temporary or permanent expulsion from the community
conduct.section.enforcement.li3=Removal from events without refund (if applicable)
conduct.section.enforcement.li4=Reporting to appropriate authorities when necessary
conduct.section.enforcement.p2=Organizers will seek to resolve conflicts with the least amount of intervention necessary. However, we prioritize the safety and well-being of community members.
conduct.section.scope.title=Scope
conduct.section.scope.p1=This Code of Conduct applies to all JavaDom community spaces, both online and offline. This includes:
conduct.section.scope.li1=Discord server and other chat platforms
conduct.section.scope.li2=GitHub repositories and discussions
conduct.section.scope.li3=Social media accounts and comments
conduct.section.scope.li4=Mailing lists and email communications
conduct.section.scope.li5=In-person meetups and events
conduct.section.scope.li6=One-on-one communications in the context of community business
conduct.section.scope.p2=This code also applies when representing the community in public spaces. Examples include using an official email address, posting via official social media accounts, or acting as a representative at online or offline events.
conduct.section.attribution.title=Attribution
conduct.section.attribution.p1=This Code of Conduct is adapted from the Contributor Covenant and the Geek Feminism Anti-Harassment Policy.
conduct.cta.title=Questions or Concerns?
conduct.cta.description=If you have questions about this Code of Conduct or need to report an incident, please don't hesitate to reach out.
conduct.cta.button=Contact Us
