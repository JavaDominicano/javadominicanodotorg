about.audience.description=JavaDom is built for people shaping the future of Java in the Dominican Republic.
about.audience.card1.title=Students & New Engineers
about.audience.card1.desc=Learn Java fundamentals, get mentorship, and accelerate your career with real community support.
about.audience.card2.title=Professional Developers
about.audience.card2.desc=Share tactics, learn new frameworks, and stay current with production-grade Java practices.
about.audience.card3.title=Architects & Tech Leads
about.audience.card3.desc=Talk architecture, platform decisions, and engineering leadership with peers who ship at scale.
