about.header.label=About Us
about.header.title=Who We Are
about.header.description=JavaDom is the Dominican Republic's Java User Community, uniting builders who care about great software.
about.mission.label=Mission
about.mission.title=Empowering Java Engineers Through Community
about.mission.p1=We create a trusted space where Java engineers share knowledge, mentorship, and practical experience. Our community connects professionals across industries and experience levels to strengthen the Dominican Republic's Java ecosystem.
about.mission.p2=JavaDom is community-first: we value clarity, empathy, and technical excellence. Every meetup, talk, and workshop is designed to elevate local talent and help teams ship better software.
about.vision.title=Our Vision
about.vision.description=A globally recognized Java community in the Caribbean, known for inclusive growth and engineering excellence.

