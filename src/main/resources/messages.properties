about.audience.card6.title=Curious Technologists
about.audience.card6.desc=Explore the JVM ecosystem, learn about the community, and find your path in Java.

about.focus.label=Our Focus
about.focus.title=Why Java Matters
about.focus.description=Java continues to power critical systems and modern cloud-native products worldwide.
about.focus.li1=Java is a career-defining skill across fintech, telecom, retail, and government services.
about.focus.li2=The JVM ecosystem keeps evolving with high-performance runtimes and modern language features.
about.focus.li3=Strong Java communities accelerate learning, mentorship, and regional innovation.

